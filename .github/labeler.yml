component:mcp:
  - changed-files:
      - any-glob-to-any-file:
          - src/second_brain_core/*.py

component:search:
  - changed-files:
      - any-glob-to-any-file:
          - src/second_brain_core/semantic/**

component:docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
        all-globs-to-all-files:
          - "!CONTRIBUTING.md"

component:ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/project.yml
          - .github/labeler.yml
          - pyproject.toml
